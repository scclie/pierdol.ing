<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pierdol.ing</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--nord0:#2e3440;--nord1:#3b4252;--nord3:#4c566a;--nord4:#d8dee9;--nord8:#88c0d0;--nord11:#bf616a;--nord14:#a3be8c;--nord15:#b48ead;--bg:var(--nord0);--fg:var(--nord4);--fg-dim:var(--nord3);--page-accent:var(--nord8);color-scheme:dark}
  html{background:var(--bg);color:var(--fg);font-family:"Space Mono",monospace;font-size:clamp(14px,1.2vw,24px);line-height:1.6;-webkit-font-smoothing:none;font-smooth:never}
  body{background:var(--bg);min-height:100vh;display:grid;place-items:center;overflow:hidden}
  ::selection{background:var(--page-accent);color:#000}
  #bttn{border:1px solid var(--page-accent);background:var(--nord1);color:var(--fg);font-family:inherit;font-size:2.2rem;padding:1rem 2rem;cursor:pointer}
  #bttn:hover{background:var(--page-accent);color:#000}
  #skip{position:fixed;top:.8rem;right:1rem;color:var(--fg-dim);cursor:pointer;user-select:none}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:var(--nord0)}
  #footer{position:fixed;bottom:.8rem;width:100%;text-align:center}
  #skip,#footer a{text-decoration:none}
  #footer a{color:var(--fg-dim)}
</style>
</head>
<body>
  <button id="bttn" type="button">bttn</button>
  <video id="v" hidden></video>
  <span id="skip" hidden>[ skip ]</span>
  <p id="footer"><a href="https://sccl.cc">sccl.cc</a></p>
<script>
(() => {
  const PIN = 'perdole.mp4';
  const $b = document.getElementById('bttn');
  const $v = document.getElementById('v');
  const $s = document.getElementById('skip');
  let order = [];
  let pos = 0;
  let loading = false;
  const clips = new Map();
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const build = (entries) => {
    const vids = entries.filter(e => e.type === 'file' && /\.(mp4|webm|mov|m4v)$/i.test(e.name));
    const pin = vids.find(e => e.name === PIN);
    order = [...(pin ? [pin] : []), ...shuffle(vids.filter(e => e.name !== PIN))];
    if (!order.length) throw new Error('No videos available');
  };
  const download = async (url, options) => {
    for (let attempt = 0; ; attempt++) {
      const r = await fetch(url, options);
      if (r.ok) return r;
      if (r.status !== 429 || attempt === 2) throw new Error('Download failed: ' + r.status);
      const retry = r.headers.get('Retry-After');
      const delay = retry === null ? 0 : /^\d+$/.test(retry)
        ? Number(retry) * 1000 : Math.max(0, Date.parse(retry) - Date.now()) || 0;
      await new Promise(resolve => setTimeout(resolve, Math.max(5000 * 2 ** attempt, delay)));
    }
  };
  const play = async () => {
    if (loading) return;
    loading = true;
    $b.hidden = true;
    $v.pause();
    $s.hidden = false;
    $s.textContent = '[ loading ]';
    try {
      if (!order.length) build(await (await download('/videos/', { cache: 'no-cache' })).json());
      const clip = order[pos];
      const url = '/videos/' + encodeURIComponent(clip.name) + '?v=' +
        encodeURIComponent(clip.size + '-' + clip.mtime);
      if (!clips.has(url)) {
        const blob = await (await download(url)).blob();
        clips.set(url, URL.createObjectURL(blob));
      }
      $v.src = clips.get(url);
      $v.hidden = false;
      $v.controls = false;
      pos = (pos + 1) % order.length;
      $v.play().catch(() => { $v.controls = true; });
    } catch (_) {
      $v.hidden = true;
      $s.hidden = true;
      $b.textContent = '[ retry ]';
      $b.hidden = false;
    } finally {
      loading = false;
      $s.textContent = '[ skip ]';
    }
  };
  $b.addEventListener('click', play);
  $s.addEventListener('click', play);
  $v.addEventListener('ended', play);
})();
</script>
</body>
</html>
